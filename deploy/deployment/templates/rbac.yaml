{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterWide }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "helm-sidecar.fullname" . }}
  labels:
    {{- include "helm-sidecar.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "helm-sidecar.fullname" . }}
  labels:
    {{- include "helm-sidecar.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "helm-sidecar.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "helm-sidecar.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helm-sidecar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-sidecar.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "helm-sidecar.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-sidecar.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "helm-sidecar.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "helm-sidecar.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
